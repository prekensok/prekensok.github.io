<head>
<meta charset="utf-8">

<title>Læstadiansk prekensøk</title>
<meta name="theme-color" content="#1c222b">
<link rel="alternate" hreflang="no" href="https://prekensok.github.io/">
<link rel="alternate" hreflang="sv" href="https://prekensok.github.io/?lang=sv">
<link rel="alternate" hreflang="fi" href="https://prekensok.github.io/?lang=fi">
<link rel="alternate" hreflang="en" href="https://prekensok.github.io/?lang=en">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Mørkt blågrått tema med salviegrønn aksent */
:root{
  --bg:#2a313b; --panel:#1c222b; --ink:#f2f4f7; --muted:rgba(242,244,247,.68); --line:#3a4452;
  --accent:#9cc4b2; --hit:#9cc4b2; --hit-ink:#1c222b; --none:rgba(242,244,247,.45); --radius:6px;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Source Sans Pro","Source Sans 3",-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.top{background:var(--panel);border-bottom:3px solid var(--accent)}
.top .in{max-width:960px;margin:0 auto;padding:24px 16px 28px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top .name{margin:0;font-size:40px;line-height:1.1;color:var(--ink);font-weight:600;letter-spacing:.01em}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:inherit;font-size:15px;padding:4px 10px;border:1px solid transparent;border-radius:var(--radius);background:none;color:var(--muted);cursor:pointer}
.langs button:hover{color:var(--ink);border-color:var(--line)}
.langs button[aria-pressed="true"]{color:var(--hit-ink);background:var(--accent);font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:40px 16px 64px}
.intro{background:var(--panel);padding:32px 40px;margin-bottom:24px;border-radius:var(--radius)}
h1{font-size:30px;margin:0 0 8px;font-weight:400;color:var(--accent)}
.sub{color:var(--ink);margin:0 0 20px;font-size:18px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border:1px solid #4b5665;border-radius:var(--radius);background:var(--bg);color:var(--ink)}
.search input::placeholder{color:var(--none)}
.search input:focus,.search select:focus,.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.search select{font:inherit;font-size:16px;padding:10px;border:1px solid #4b5665;border-radius:var(--radius);background:var(--bg);color:var(--ink);max-width:100%}
.hint{color:var(--muted);font-size:14px;margin:12px 0 0}
.hint + .hint{margin-top:6px}
.hint button{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.hint button:hover{text-decoration:underline}
.note{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--accent);color:var(--ink);font-size:15px;background:rgba(156,196,178,.08);border-radius:0 var(--radius) var(--radius) 0}
.count{color:var(--ink);font-size:16px;margin:0 0 12px}
.card{background:var(--panel);padding:28px 40px;margin-bottom:16px;border-radius:var(--radius)}
.texts{font-size:26px;color:var(--accent);line-height:1.25}
.days{color:var(--ink);font-size:17px;margin-top:6px}
.kw{color:var(--muted);font-style:italic;font-size:16px;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:16px}
th,td{text-align:left;padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:400;color:var(--muted);width:46%}
td.ref{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.det{display:block;color:var(--muted);font-size:14px;font-weight:400}
mark{background:var(--hit);color:var(--hit-ink);padding:0 3px}
.abbr{font-size:13px;color:var(--accent);white-space:nowrap}
.lang{font-size:13px;color:var(--none)}
details.about{margin-top:40px;background:var(--panel);padding:24px 40px;border-radius:var(--radius)}
details.about summary{cursor:pointer;color:var(--accent);font-size:20px}
details.about table th{width:auto}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.empty{color:var(--muted);padding:20px 0}
.more{display:block;margin:16px auto;font:inherit;padding:10px 20px;border:1px solid var(--accent);border-radius:var(--radius);background:transparent;color:var(--accent);cursor:pointer}
.more:hover{background:var(--accent);color:var(--hit-ink)}
@media (max-width:640px){
  .top .in{padding:16px 16px 18px}
  .top .name{font-size:28px}
  .intro,.card,details.about{padding:20px 16px}
  .texts{font-size:22px}
  th{width:50%}
}
</style>
</head>

<div class="top"><div class="in">

const EN_MOSES = ["","Gen","Exod","Lev","Num","Deut"];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => String(s||"").toLowerCase().replace(/[.,:;()\-–!?«»“”"]/g," ").replace(/\s+/g," ").trim();
const idnorm = s => String(s||"").toLowerCase().replace(/[\s.]/g,"").replace(/^s(?=\d)/,"s");
const BOOKRE = /^\s*([1-5])?\s*\.?\s*([A-Za-zÅÄÖØÆåäöøæ]+)\.?\s*(.*)$/;

function parseRef(s){
  const m = String(s).match(BOOKRE);
  if (!m) return null;
  const w = m[2].toLowerCase();
  if (MOSES[w] && !m[1]) return {num:MOSES[w], book:"mos", rest:m[3]};
  const b = BOOK[w];
  return b ? {num:m[1] || "", book:b, rest:m[3]} : null;
}
function bibleKey(s){
  // "1 Mos 3:15" / "1. Moos. 3:15" / "Gen 3:15" / "Matt.21:5" -> "1mos 3 15"
  const r = parseRef(s);
  if (!r) return null;
  return (r.num + r.book + " " + (r.rest.match(/\d+/g) || []).join(" ")).trim();
}
function showRef(t){
  const r = parseRef(t);
  if (!r) return t;
  const sep = L === "no" ? "," : ":";
  const rest = r.rest.trim().replace(/^(\d+)\s*[:,]\s*/, "$1" + sep);
  const base = r.book.charAt(0).toUpperCase() + r.book.slice(1);
  if (L === "en" && r.book === "mos") return EN_MOSES[+r.num] + " " + rest;
  const name = (SHOW[L][r.book]) || base;
  const num = r.num ? (L === "fi" ? r.num + ". " : r.num + " ") : "";
  return (num + name + " " + rest).trim();
}

// Søndager/anledninger og tekster fra de norske registrene
function extras(e){
  const days = [], texts = [];
  if (e.p1){ days.push(e.p1[0]); if (e.p1[1] && !/^Ingen/.test(e.p1[1])) texts.push(e.p1[1]); if (e.p1[2]) texts.push(e.p1[2]); }
  (e.r.RRS||[]).forEach(n => { const r = DATA.rrs[n]; if (r){ days.push(r[1]); if (r[2]) texts.push(r[2]); if (r[3]) texts.push(r[3]); } });
  (e.r.AK||[]).forEach(n => { const a = DATA.ak[n]; if (a){ days.push(a[0]); texts.push(a[1]); } });
  (e.r.BR||[]).forEach(n => { const b = DATA.br[n]; if (b){ days.push(b[0] + (b[1] ? " (" + b[1] + ")" : "")); if (b[2]) texts.push(b[2]); } });
  return {days, texts};
}

const INDEX = DATA.e.map((e, i) => {
  const x = extras(e);
  const allTexts = [...e.t, ...x.texts];
  return {
    i, e, x,
    days: [...new Set(x.days.filter(Boolean))],
    bible: allTexts.map(bibleKey).filter(Boolean),
    words: fold([...e.k, ...x.days, ...allTexts].join(" ")),
    ids: Object.entries(e.r).flatMap(([c, v]) => v.map(n => [c, idnorm(n)]))
  };
});
const shownTexts = it => [...new Set((it.e.t.length ? it.e.t : it.x.texts).map(showRef))];

const $q = document.getElementById("q"), $f = document.getElementById("f"),
      $out = document.getElementById("out"), $count = document.getElementById("count");

function parseQuery(q, f){
  q = q.trim();
  let col = f || null, rest = q;
  const m = q.match(/^(\p{L}+(?: nr)?)\.?\s+(\S.*)$/u);
  if (m && ALIAS[m[1].toLowerCase()] && /\d/.test(m[2]) && !bibleKey(q)) { col = ALIAS[m[1].toLowerCase()]; rest = m[2]; }
  return {col, rest};
}

function search(q, f){
  const {col, rest} = parseQuery(q, f);
  const id = idnorm(rest), isId = /^(s)?\d+[a-c]?$/i.test(id) || /^\d+:\d+$/.test(rest.trim());
  const bk = bibleKey(rest), words = fold(rest);
  const needles = [words, ...SYN.filter(([k]) => words.includes(k)).map(([, v]) => v)];
  const res = [];
  for (const it of INDEX){
    let score = 0; const hit = new Set();
    if (isId){
      for (const [c, n] of it.ids){
        if ((!col || c === col || (col === "PI" && c === "PAN")) && (n === id || n === "s" + id)) { score = 100; hit.add(c); }
      }
    }
    if (!col || !isId){
      if (bk && it.bible.some(b => (b + " ").startsWith(bk + " "))) score = Math.max(score, 50);
      else if (!isId && words.length > 1 && needles.some(n => it.words.includes(n))) score = Math.max(score, 20);
      if (col && score && !it.e.r[col]) score = 0;
    }
    if (score) res.push({it, score, hit});
  }
  res.sort((a, b) => b.score - a.score || (b.it.e.r.P1 ? 1 : 0) - (a.it.e.r.P1 ? 1 : 0) || a.it.i - b.it.i);
  return {res, words: isId ? "" : [rest, ...needles.slice(1)].join(" ")};
}

function hl(text, q){
  if (!q) return esc(text);
  const ws = fold(q).split(" ").filter(w => w.length > 1 && !/^\d+$/.test(w)).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!ws.length) return esc(text);
  return esc(text).replace(new RegExp("(" + ws.join("|") + ")", "ig"), "<mark>$1</mark>");
}

function refDetail(c, n){
  const t = T[L];
  if (c === "RRS"){ const r = DATA.rrs[n]; if (r) return `${t.vol} ${r[0]} · ${r[1]}` + [r[2], r[3]].filter(Boolean).map(x => " · " + showRef(x)).join(""); }
  if (c === "BR"){ const b = DATA.br[n]; if (b) return b[0] + (b[1] ? ` (${b[1]})` : "") + (b[2] ? " · " + showRef(b[2]) : ""); }
  if (c === "AK"){ const a = DATA.ak[n]; if (a) return `${a[0]} · ${showRef(a[1])} · ${t.ak(a[2])}`; }
  if (c === "SP") return t.sp;
  return "";
}

function fmtRef(c, n){
  const page = T[L].page;
  if (/^s\. ?\d/.test(n)) return page + " " + n.replace(/^s\. ?/, "");
  const unit = COL[c][4];
  if (unit === "page") return page + " " + n;
  if (unit === "yr") return n;
  return n.replace(/^(\d+)([A-C])$/, "$1 $2");
}

function card(r, q){
  const {it, hit} = r, e = it.e, t = T[L];
  const st = shownTexts(it);
  const texts = st.length ? st.join(" · ") : t.noText;
  const rows = COLS.filter(c => e.r[c[0]] !== undefined).map(c => {
    const vals = e.r[c[0]];
    const short = (e.s || []).includes(c[0]) ? " –" : "";
    let cell;
    if (!vals.length) cell = `<span class="det">${esc(t.flagOnly)}</span>`;
    else cell = vals.map(n => {
      const d = refDetail(c[0], n), v = esc(fmtRef(c[0], n)) + short;
      return (hit.has(c[0]) ? `<mark>${v}</mark>` : v) + (d ? `<span class="det">${hl(d, q)}</span>` : "");
    }).join("<br>");
    return `<tr><th>${esc(c[2])} <span class="abbr">${esc(c[1])}</span> <span class="lang">${t.lang[c[3]]}</span></th><td class="ref">${cell}</td></tr>`;
  }).join("");
  return `<div class="card">
    <div class="texts">${hl(texts, q)}</div>
    ${it.days.length ? `<div class="days">${hl(it.days.join(" · "), q)}</div>` : ""}
    ${e.k.length ? `<div class="kw">«${hl(e.k.join(" "), q)}»</div>` : ""}
    <table>${rows}</table></div>`;
}

let LIMIT = 40;
function run(){
  const q = $q.value, f = $f.value, t = T[L];
  if (!q.trim()){
    $count.textContent = t.start;
    $out.innerHTML = ""; saveUrl(); return;
  }
  const {res, words} = search(q, f);
  $count.textContent = res.length ? t.count(res.length) : "";
  $out.innerHTML = res.length
    ? res.slice(0, LIMIT).map(r => card(r, words)).join("") + (res.length > LIMIT ? `<button class="more" id="more">${t.more(res.length - LIMIT)}</button>` : "")
    : `<div class="empty">${esc(t.none(q))}</div>`;
  const more = document.getElementById("more");
  if (more) more.onclick = () => { LIMIT += 40; run(); };
  saveUrl();
}

function saveUrl(){
  const q = $q.value.trim();
  const url = location.pathname + (L === "no" ? "" : "?lang=" + L) + (q ? "#" + encodeURIComponent(q) : "");
  try { history.replaceState(null, "", url); } catch(e){}
}

const exBtn = s => `<button data-q="${esc(s)}">${esc(s)}</button>`;
function applyLang(){
  const t = T[L];
  document.documentElement.lang = L;
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  $q.placeholder = t.ph;
  $f.setAttribute("aria-label", t.inCol);
  const sel = $f.value;
  $f.innerHTML = `<option value="">${esc(t.all)}</option>` + COLS.filter(c => c[0] !== "PAN").map(c => `<option value="${c[0]}">${esc(c[1])} – ${esc(c[2])}</option>`).join("");
  $f.value = sel;
  document.getElementById("examples").innerHTML = esc(t.ex) + " " + t.examples.map(exBtn).join(" · ");
  document.getElementById("tip").innerHTML = esc(t.tip("§")).replace("§", exBtn("83"));
  document.querySelectorAll(".hint button").forEach(b => b.addEventListener("click", () => { $q.value = b.dataset.q; $f.value = ""; LIMIT = 40; run(); $q.focus(); }));
  document.getElementById("coltable").innerHTML = `<tr><th>${esc(t.hAbbr)}</th><th>${esc(t.hCol)}</th><th>${esc(t.hLang)}</th></tr>` +
    COLS.filter(c => c[0] !== "PAN").map(c => `<tr><td class="abbr">${esc(c[1])}</td><td>${esc(c[2])}</td><td>${t.lang[c[3]]}</td></tr>`).join("");
  document.getElementById("sources").innerHTML = t.sources;
  document.getElementById("langs").innerHTML = LANGS.map(([k, n]) => `<button lang="${k}" data-l="${k}" aria-pressed="${k === L}">${n}</button>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
    L = b.dataset.l;
    try { localStorage.setItem("lang", L); } catch(e){}
    applyLang(); run();
  }));
}

$q.addEventListener("input", () => { LIMIT = 40; run(); });
$f.addEventListener("change", () => { LIMIT = 40; run(); });
if (location.hash) $q.value = decodeURIComponent(location.hash.slice(1));
applyLang();
run();
</script>
